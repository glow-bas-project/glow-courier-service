plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()

    // Add GitLab Maven build artifact for glow-user-service
    def ciApiV4Url = System.getenv('CI_API_V4_URL')
    def ciJobToken = System.getenv('CI_JOB_TOKEN')
    def userServiceProjectId = System.getenv('USER_SERVICE_PROJECT_ID')
    def userServiceProjectPath = System.getenv('USER_SERVICE_PROJECT_PATH') ?: 'backend-architecture-and-scalability/glow-user-service'
    def userServiceProjectRef = 25979
    if (ciApiV4Url && ciJobToken) {
        maven {
            url = uri("${ciApiV4Url}/projects/${userServiceProjectRef}/packages/maven")
            credentials(org.gradle.api.credentials.HttpHeaderCredentials) {
                name = 'Job-Token'
                value = ciJobToken
            }
            authentication {
                header(org.gradle.authentication.http.HttpHeaderAuthentication)
            }
        }
    }
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'com.glow:user-service:1.0.0-SNAPSHOT' // Dependency on glow-user-service

    implementation 'io.quarkus:quarkus-arc'

    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'

    implementation 'io.quarkus:quarkus-kubernetes'
    implementation 'io.quarkus:quarkus-kubernetes-config'

    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-rest-client-jackson'
    implementation 'io.quarkus:quarkus-messaging-kafka'

    implementation 'io.quarkus:quarkus-oidc'

    implementation 'io.quarkus:quarkus-scheduler'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    implementation 'io.quarkus:quarkus-logging-json'
    implementation("org.jboss.slf4j:slf4j-jboss-logmanager")
    implementation 'io.quarkus:quarkus-opentelemetry'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-smallrye-fault-tolerance'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.rest-assured:rest-assured'
}

group = 'com.glow'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}
