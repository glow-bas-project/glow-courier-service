pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}
def userServiceBuild = file('../glow-user-service')

if (userServiceBuild.exists()) {
    includeBuild(userServiceBuild) {
        dependencySubstitution {
            substitute(module('com.glow:user-service'))
                .using(project(':'))
        }
    }
}
rootProject.name='courier-service'
