pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}

def userServiceDir = file('../glow-user-service')
if (!System.getenv('CI') && userServiceDir.exists()) {
    includeBuild(userServiceDir) {
        dependencySubstitution {
            substitute(module('com.glow:user-service'))
                .using(project(':'))
        }
    }
}
rootProject.name='courier-service'
